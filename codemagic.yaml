
workflows:
  hnmod-ios:
    name: HN Mod IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Extract HN Mod project
        script: |
          set -e
          unzip -o HN_Mod_iOS_AdHoc_Project.zip -d "$CM_BUILD_DIR"

          echo "=== Locate source files ==="
          find "$CM_BUILD_DIR" -name "ContentView.swift" -o -name "Info.plist" -o -name "AppLogo.png"

      - name: Prepare project files
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          SOURCE=$(find "$CM_BUILD_DIR" -name "ContentView.swift" -not -path "*/build/*" -print -quit)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: ContentView.swift not found"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$SOURCE")
          echo "Source folder: $SOURCE_DIR"

          for FILE in ContentView.swift Info.plist AppLogo.png; do
            if [ -f "$SOURCE_DIR/$FILE" ]; then
              cp "$SOURCE_DIR/$FILE" "$CM_BUILD_DIR/$FILE"
            fi
          done

          if [ ! -f "$CM_BUILD_DIR/AppLogo.png" ]; then
            echo "ERROR: AppLogo.png not found"
            exit 1
          fi

          if [ ! -d "$CM_BUILD_DIR/Assets.xcassets" ]; then
            ASSETS=$(find "$CM_BUILD_DIR" -type d -name "Assets.xcassets" -not -path "*/build/*" -print -quit)
            if [ -n "$ASSETS" ]; then
              cp -R "$ASSETS" "$CM_BUILD_DIR/Assets.xcassets"
            fi
          fi

          echo "=== Verify files ==="
          ls -la "$CM_BUILD_DIR/ContentView.swift"
          ls -la "$CM_BUILD_DIR/AppLogo.png"
          ls -ld "$CM_BUILD_DIR/Assets.xcassets"

      - name: Build unsigned IPA
        script: |
          set -e

          xcodebuild \
            -project "$CM_BUILD_DIR/HNMod.xcodeproj" \
            -scheme HNMod \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/Payload"

          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/HNMod.app"

          test -d "$APP_PATH"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r HNMod.ipa Payload

    artifacts:
      - HNMod.ipa
