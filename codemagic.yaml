
workflows:
  hnmod-ios:
    name: HN Mod IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Extract HN Mod project
        script: |
          set -e
          unzip -o HN_Mod_iOS_AdHoc_Project.zip -d "$CM_BUILD_DIR"

          echo "=== Project files ==="
          find "$CM_BUILD_DIR" -name "HNMod.xcodeproj" -o -name "AppLogo.png" -o -name "Assets.xcassets"

      - name: Prepare app resources
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          if [ ! -f AppLogo.png ]; then
            LOGO=$(find "$CM_BUILD_DIR" -type f -name "AppLogo.png" -not -path "*/build/*" -print -quit)
            if [ -n "$LOGO" ]; then
              cp "$LOGO" AppLogo.png
            else
              echo "Creating placeholder AppLogo.png"
              python3 - <<'PY'
          import struct, zlib
          w = h = 1
          raw = b'\x00\x30\x70\xD0'
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t+d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack(">2I5B", w, h, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw))
          png += chunk(b'IEND', b'')
          open("AppLogo.png", "wb").write(png)
          PY
            fi
          fi

          if [ ! -d Assets.xcassets ]; then
            SOURCE=$(find "$CM_BUILD_DIR" -type d -name "Assets.xcassets" -not -path "*/build/*" -print -quit)
            if [ -n "$SOURCE" ]; then
              cp -R "$SOURCE" Assets.xcassets
            fi
          fi

          mkdir -p Assets.xcassets/AppIcon.appiconset

          if [ ! -f Assets.xcassets/AppIcon.appiconset/AppIcon.png ]; then
            python3 - <<'PY'
          import struct, zlib
          w = h = 1024
          row = b'\x00' + bytes([35, 105, 220, 255]) * w
          raw = row * h
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t+d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack(">2I5B", w, h, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw))
          png += chunk(b'IEND', b'')
          open("Assets.xcassets/AppIcon.appiconset/AppIcon.png", "wb").write(png)
          PY
          fi

          cat > Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          echo "=== Resources prepared ==="
          ls -la Assets.xcassets/AppIcon.appiconset
          ls -la AppLogo.png

      - name: Build unsigned IPA
        script: |
          set -e

          xcodebuild \
            -project "$CM_BUILD_DIR/HNMod.xcodeproj" \
            -scheme HNMod \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/Payload"

          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/HNMod.app"

          test -d "$APP_PATH"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r HNMod.ipa Payload

    artifacts:
      - HNMod.ipa
