
workflows:
  hnmod-ios:
    name: HN Mod IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Extract HN Mod project
        script: |
          set -e
          unzip -o HN_Mod_iOS_AdHoc_Project.zip -d "$CM_BUILD_DIR"

          echo "=== Locate source files ==="
          find "$CM_BUILD_DIR" \
            \( -name "ContentView.swift" -o -name "Info.plist" -o -name "AppLogo.png" \) \
            -not -path "*/build/*"

      - name: Prepare project files
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          SOURCE=$(find "$CM_BUILD_DIR" -name "ContentView.swift" -not -path "*/build/*" -print -quit)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: ContentView.swift not found"
            exit 1
          fi

          cp "$SOURCE" "$CM_BUILD_DIR/ContentView.swift"

          if [ ! -f "$CM_BUILD_DIR/Info.plist" ]; then
            PLIST=$(find "$CM_BUILD_DIR" -name "Info.plist" -not -path "*/build/*" -print -quit)
            if [ -n "$PLIST" ]; then
              cp "$PLIST" "$CM_BUILD_DIR/Info.plist"
            fi
          fi

          if [ ! -f "$CM_BUILD_DIR/AppLogo.png" ]; then
            LOGO=$(find "$CM_BUILD_DIR" -name "AppLogo.png" -not -path "*/build/*" -print -quit)
            if [ -n "$LOGO" ]; then
              cp "$LOGO" "$CM_BUILD_DIR/AppLogo.png"
            else
              echo "ERROR: AppLogo.png not found"
              exit 1
            fi
          fi

          if [ ! -d "$CM_BUILD_DIR/Assets.xcassets" ]; then
            ASSETS=$(find "$CM_BUILD_DIR" -type d -name "Assets.xcassets" -not -path "*/build/*" -print -quit)
            if [ -n "$ASSETS" ]; then
              cp -R "$ASSETS" "$CM_BUILD_DIR/Assets.xcassets"
            else
              echo "ERROR: Assets.xcassets not found"
              exit 1
            fi
          fi

          echo "=== Verify project files ==="
          test -f "$CM_BUILD_DIR/ContentView.swift"
          test -f "$CM_BUILD_DIR/AppLogo.png"
          test -d "$CM_BUILD_DIR/Assets.xcassets"
          test -d "$CM_BUILD_DIR/HNMod.xcodeproj"

      - name: Build unsigned app
        script: |
          set -e

          xcodebuild \
            -project "$CM_BUILD_DIR/HNMod.xcodeproj" \
            -scheme HNMod \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package and verify IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/HNMod.app"

          echo "=== Check built app ==="
          test -d "$APP_PATH"
          ls -lah "$APP_PATH"
          du -sh "$APP_PATH"

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP_PATH/Info.plist")
          test -f "$APP_PATH/$EXECUTABLE"

          echo "=== Package IPA ==="
          rm -rf Payload HNMod.ipa HNMod-download.zip
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload HNMod.ipa

          echo "=== Verify IPA ==="
          unzip -l HNMod.ipa
          test -s HNMod.ipa

          SIZE=$(stat -f%z HNMod.ipa)
          echo "IPA size: $SIZE bytes"

          if [ "$SIZE" -lt 500000 ]; then
            echo "ERROR: IPA is unexpectedly small"
            exit 1
          fi

          zip -j HNMod-download.zip HNMod.ipa

          echo "=== Final files ==="
          ls -lh HNMod.ipa HNMod-download.zip

    artifacts:
      - HNMod.ipa
      - HNMod-download.zip
