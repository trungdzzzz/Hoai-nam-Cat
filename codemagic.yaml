workflows:
  hnmod-ios:
    name: HN Mod IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Extract HN Mod project
        script: |
          unzip -o HN_Mod_iOS_AdHoc_Project.zip -d "$CM_BUILD_DIR"
          find "$CM_BUILD_DIR" -name "AppLogo.png"

#!/usr/bin/env bash
set -e

echo "=== Checking project files ==="
ls -la "$CM_BUILD_DIR"
find "$CM_BUILD_DIR" -name "AppLogo.png" -print

echo "=== Building HN Mod ==="
xcodebuild \
  -project "$CM_BUILD_DIR/HNMod.xcodeproj" \
  -scheme HNMod \
  -configuration Release \
  -sdk iphoneos \
  -derivedDataPath "$CM_BUILD_DIR/build" \
  CODE_SIGNING_ALLOWED=NO \
  build
      - name: Package IPA
        script: |
          mkdir -p Payload
          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/HNMod.app"
          cp -R "$APP_PATH" Payload/
          zip -r "$CM_BUILD_DIR/HNMod.ipa" Payload

    artifacts:
      - HNMod.ipa
