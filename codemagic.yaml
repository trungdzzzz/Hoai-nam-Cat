
workflows:
  hnmod-ios:
    name: HN Mod IPA
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Extract HN Mod project
        script: |
          set -e
          unzip -o HN_Mod_iOS_AdHoc_Project.zip -d "$CM_BUILD_DIR"

          echo "=== Locate source files ==="
          find "$CM_BUILD_DIR" \( -name "ContentView.swift" -o -name "Info.plist" -o -name "AppLogo.png" \) -not -path "*/build/*"

      - name: Prepare project files
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          SOURCE=$(find "$CM_BUILD_DIR" -name "ContentView.swift" -not -path "*/build/*" -print -quit)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: ContentView.swift not found"
            exit 1
          fi

          SOURCE_DIR=$(dirname "$SOURCE")

          cp "$SOURCE" "$CM_BUILD_DIR/ContentView.swift"

          if [ -f "$SOURCE_DIR/Info.plist" ]; then
            cp "$SOURCE_DIR/Info.plist" "$CM_BUILD_DIR/Info.plist"
          fi

          if [ ! -f "$CM_BUILD_DIR/AppLogo.png" ]; then
            LOGO=$(find "$CM_BUILD_DIR" -name "AppLogo.png" -not -path "*/build/*" -print -quit)
            if [ -n "$LOGO" ]; then
              cp "$LOGO" "$CM_BUILD_DIR/AppLogo.png"
            else
              echo "ERROR: AppLogo.png not found"
              exit 1
            fi
          fi

          if [ ! -d "$CM_BUILD_DIR/Assets.xcassets" ]; then
            ASSETS=$(find "$CM_BUILD_DIR" -type d -name "Assets.xcassets" -not -path "*/build/*" -print -quit)
            if [ -n "$ASSETS" ]; then
              cp -R "$ASSETS" "$CM_BUILD_DIR/Assets.xcassets"
            fi
          fi

          echo "=== Verify files ==="
          test -f "$CM_BUILD_DIR/ContentView.swift"
          test -f "$CM_BUILD_DIR/AppLogo.png"
          test -d "$CM_BUILD_DIR/Assets.xcassets"

      - name: Build unsigned IPA
        script: |
          set -e

          xcodebuild \
            -project "$CM_BUILD_DIR/HNMod.xcodeproj" \
            -scheme HNMod \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR"

          mkdir -p Payload

          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/HNMod.app"

          test -d "$APP_PATH"

          cp -R "$APP_PATH" Payload/
          zip -r HNMod.ipa Payload

          zip -j HNMod-download.zip HNMod.ipa

          echo "=== Check output files ==="
          ls -lh HNMod.ipa HNMod-download.zip

    artifacts:
      - HNMod-download.zip
