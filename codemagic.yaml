
workflows:
  hnmod-ios:
    name: HN Mod IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Extract HN Mod project
        script: |
          unzip -o HN_Mod_iOS_AdHoc_Project.zip -d "$CM_BUILD_DIR"
          echo "=== Project files ==="
          find "$CM_BUILD_DIR" -name "AppLogo.png" -o -name "HNMod.xcodeproj"

      - name: Build unsigned IPA
        script: |
          set -e
          echo "=== Checking AppLogo.png ==="
          find "$CM_BUILD_DIR" -name "AppLogo.png" -print
          xcodebuild \
            -project "$CM_BUILD_DIR/HNMod.xcodeproj" \
            -scheme HNMod \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/Payload"
          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/HNMod.app"
          test -d "$APP_PATH"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r HNMod.ipa Payload

    artifacts:
      - HNMod.ipa
